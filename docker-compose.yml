# Local dependencies: PostgreSQL 16 and Redis 7 (same major versions as Azure and the AKS chart).
#   docker compose up -d --wait
#   pnpm --filter @statline/api prisma:migrate && pnpm --filter @statline/api db:seed
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: statline
      POSTGRES_PASSWORD: statline
      POSTGRES_DB: statline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statline -d statline"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
