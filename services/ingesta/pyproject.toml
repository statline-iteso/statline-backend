[project]
name = "statline-ingesta"
version = "1.2.0"
description = "StatLine batch ingestion: one CronJob per sport pulls games and box scores from API-Sports"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27,<0.29",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "jsonschema>=4.23,<5",
  "pydantic-settings>=2.6,<3",
  "prometheus-client>=0.21,<1",
  "sentry-sdk==2.74.0",
]

[project.scripts]
ingesta = "ingesta.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "pandas-stubs>=2.2",
  "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingesta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ingesta --cov-report=term-missing --cov-fail-under=70"
markers = ["integration: needs a real PostgreSQL (DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["ingesta"]
