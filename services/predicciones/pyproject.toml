[project]
name = "statline-predicciones"
version = "0.1.0"
description = "StatLine inference service: match outcome (logistic regression) and player projections (gradient boosting)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "prometheus-client>=0.21,<1",
  "scikit-learn>=1.5,<2",
  "pandas>=2.2,<3",
  "joblib>=1.4,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predicciones"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=predicciones --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["predicciones"]
