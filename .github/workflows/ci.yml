name: CI

# Proposal §4.3, step 1: lint and types, unit tests with a 70 % coverage gate, integration tests
# against an ephemeral PostgreSQL, multi-stage image builds and a Trivy scan that fails on
# HIGH/CRITICAL findings. Nothing here pushes images; cd.yml does that after the merge.
# Also: hadolint on the Dockerfiles, actionlint and zizmor on the workflows, gitleaks over the
# whole history. CodeQL runs in codeql.yml.

on:
  push:
    branches: [main, develop]
  pull_request:
  # auto-merge.yml starts this run on develop after each merge (GITHUB_TOKEN merges fire no push).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api · lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma client
        run: pnpm --filter @statline/api prisma:generate
      - run: pnpm --filter @statline/api lint
      - run: pnpm --filter @statline/api format:check
      - run: pnpm --filter @statline/api typecheck
      - name: Unit tests (Jest + Supertest, coverage ≥ 70 %)
        run: >-
          pnpm --filter @statline/api test:coverage --json --outputFile=jest-results.json
          --coverageReporters=text --coverageReporters=json-summary
      - name: Test summary
        if: ${{ !cancelled() }}
        run: >-
          node .github/scripts/resumen-pruebas.mjs "api · Jest"
          services/api/jest-results.json services/api/coverage/coverage-summary.json

  python:
    name: ${{ matrix.service }} · ruff, mypy, pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ingesta, predicciones]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Unit tests (pytest, coverage ≥ 70 %)
        run: uv run pytest --junitxml=pytest-results.xml --cov-report=json:coverage.json
      - name: Test summary
        if: ${{ !cancelled() }}
        env:
          SERVICIO: ${{ matrix.service }}
        run: uv run python ../../.github/scripts/resumen_pytest.py "$SERVICIO · pytest" pytest-results.xml coverage.json

  integration:
    name: integration · PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: statline
          POSTGRES_PASSWORD: statline
          POSTGRES_DB: statline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U statline" --health-interval 2s --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://statline:statline@localhost:5432/statline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prisma migrations
        run: pnpm --filter @statline/api prisma:migrate
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Ingesta repository against the real schema
        working-directory: services/ingesta
        run: uv sync --frozen && uv run pytest -m integration --no-cov
      - name: Predicciones SQL and registry against the real schema
        working-directory: services/predicciones
        run: uv sync --frozen && uv run pytest -m integration --no-cov

  images:
    name: image · ${{ matrix.service }}
    needs: [api, python]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, predicciones, ingesta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (multi-stage, linux/amd64 like the AKS nodes)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: statline/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: statline/${{ matrix.service }}:ci
          version: v0.76.1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  dockerfiles:
    name: dockerfiles · hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint (config in .hadolint.yaml)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$HADOLINT_IMAGE" \
            hadolint --config .hadolint.yaml services/api/Dockerfile services/predicciones/Dockerfile services/ingesta/Dockerfile
        env:
          HADOLINT_IMAGE: hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e

  workflows:
    name: workflows · actionlint, zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (bundles shellcheck for run steps)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color
        env:
          ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - name: zizmor (workflow security; fails on any finding)
        run: uvx zizmor@1.31.1 --format github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  secrets:
    name: secrets · gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not just this commit
          persist-credentials: false
      - name: gitleaks over every commit
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$GITLEAKS_IMAGE" git /repo --redact --no-banner --verbose
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
